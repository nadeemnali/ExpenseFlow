<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2EC4B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B9AAA;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" fill="#F0F4F8"/>
  
  <!-- Outer glow circle -->
  <circle cx="512" cy="512" r="460" fill="#FF6F59" opacity="0.15" filter="url(#glowFilter)"/>
  
  <!-- Rotating accent ring -->
  <circle cx="512" cy="512" r="390" fill="none" stroke="url(#ringGradient)" stroke-width="90" opacity="0.9"/>
  
  <!-- Inner circle background -->
  <circle cx="512" cy="512" r="340" fill="#D9E5F0" opacity="0.6"/>
  
  <!-- Wallet shape -->
  <g transform="translate(512, 512)">
    <!-- Wallet body -->
    <rect x="-150" y="-140" width="300" height="240" rx="80" fill="#1B9AAA"/>
    
    <!-- Wallet slot/opening -->
    <rect x="-150" y="-140" width="300" height="70" rx="50" fill="#2EC4B6" opacity="0.7"/>
    
    <!-- Card slot (credit card in wallet) -->
    <rect x="60" y="-115" width="100" height="55" rx="8" fill="#2EC4B6"/>
    
    <!-- Dollar sign - Simplified solid design -->
    <g transform="translate(-10, 35)">
      <!-- Vertical stroke -->
      <rect x="-8" y="-90" width="16" height="180" fill="#1B9AAA" rx="8"/>
      
      <!-- Top curve -->
      <circle cx="0" cy="-70" r="38" fill="none" stroke="#1B9AAA" stroke-width="16"/>
      
      <!-- Bottom curve -->
      <circle cx="0" cy="70" r="38" fill="none" stroke="#1B9AAA" stroke-width="16"/>
      
      <!-- Top horizontal bar -->
      <rect x="-48" y="-42" width="96" height="16" fill="#1B9AAA" rx="8"/>
      
      <!-- Bottom horizontal bar -->
      <rect x="-48" y="26" width="96" height="16" fill="#1B9AAA" rx="8"/>
    </g>
  </g>
</svg>
